name: Build and deploy Gatehouse demo

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build Spring Boot API
        run: mvn -B -f backend/pom.xml -DskipTests package

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true')
    needs: build-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure API URL for Cloudflare Pages
        run: printf "window.GATEHOUSE_API_BASE = 'https://gatehouse-demo.onrender.com';\\n" > frontend/config.js
      - name: Install Cloudflare CLI
        run: npm install --global cf@0.15.0
      - name: Deploy frontend to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_GATE_HOUSE }}
          CLOUDFLARE_ACCOUNT_ID: 9eb8a40b061418ea81c226d47b6a1d32
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
          cf pages projects deployments create gatehouse-demo --pages-build-output-dir frontend --branch main
