name: Build and deploy Gatehouse demo

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build Spring Boot API
        run: mvn -B -f backend/pom.xml -DskipTests package

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true')
    needs: build-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - name: Configure API URL for Cloudflare Pages
        run: printf "window.GATEHOUSE_API_BASE = 'https://gatehouse-demo.onrender.com';\n" > frontend/config.js
      - name: Deploy frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9eb8a40b061418ea81c226d47b6a1d32
          command: pages deploy frontend --project-name=gatehouse-demo --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
