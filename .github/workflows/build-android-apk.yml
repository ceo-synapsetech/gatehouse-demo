name: Build Gatehouse role APKs

on:
  push:
    branches:
      - main
      - codex/role-specific-apks
    paths:
      - mobile/**
      - .github/workflows/build-android-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}

      - name: Resolve Flutter packages
        working-directory: mobile
        run: flutter pub get

      - name: Build resident APK
        working-directory: mobile
        run: flutter build apk --release --flavor resident --target-platform android-arm64 --dart-define=GATEHOUSE_APP_ROLE=resident

      - name: Upload resident APK
        uses: actions/upload-artifact@v4
        with:
          name: gatehouse-resident-apk
          path: mobile/build/app/outputs/flutter-apk/app-resident-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build security APK
        working-directory: mobile
        run: flutter build apk --release --flavor security --target-platform android-arm64 --dart-define=GATEHOUSE_APP_ROLE=security

      - name: Upload security APK
        uses: actions/upload-artifact@v4
        with:
          name: gatehouse-security-apk
          path: mobile/build/app/outputs/flutter-apk/app-security-release.apk
          if-no-files-found: error
          retention-days: 14

