<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gatehouse Demo</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');:root{--ink:#182824;--muted:#71807b;--line:#e4eae6;--paper:#f4f7f4;--green:#1b5a46;--mint:#e3f1e9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}[hidden]{display:none!important}.top{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(calc((100vw - 1000px)/2),20px)}.brand{font:800 18px Manrope;color:var(--green)}main{max-width:1000px;margin:38px auto;padding:0 20px}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:18px}.title{font:700 27px Manrope;margin:0 0 6px}.muted{color:var(--muted);font-size:13px}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit;font-size:13px}.field textarea{min-height:70px}.btn{border:0;border-radius:8px;padding:11px 14px;background:var(--green);color:white;font-weight:700;font-size:13px;cursor:pointer}.btn.alt{background:#edf5ef;color:var(--green);border:1px solid #d2e5d8}.btn.deny{background:#fff4f2;color:#9d483c;border:1px solid #efd4cf}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;background:#edf1ee;border:0;border-radius:8px;padding:10px;font-weight:700;color:#617069;cursor:pointer}.tabs button.active{background:var(--mint);color:var(--green)}.request{padding:15px 0;border-bottom:1px solid #edf0ed}.request:last-child{border:0}.request h3{font-size:14px;margin:0 0 5px}.request p{font-size:12px;line-height:1.5;color:var(--muted);margin:0}.badge{font-size:10px;font-weight:700;padding:6px 9px;border-radius:20px;background:#fbf1dc;color:#886629}.badge.approved{background:#e2f2e8;color:#28734e}.badge.denied{background:#fae9e6;color:#a74c42}.actions{display:flex;gap:7px;margin-top:9px}.message{min-height:18px;font-size:12px;color:#a64f44}.toast{background:#eaf3ec;padding:11px;border-radius:8px;font-size:12px;color:#36664c}.top button{border:1px solid var(--line);background:white;padding:8px 10px;border-radius:7px;cursor:pointer}@media(max-width:720px){.grid{grid-template-columns:1fr}main{margin:23px auto}.top{height:60px}}
</style></head><body><header class="top"><div class="brand">⌂ Gatehouse</div><button id="logout" hidden>Sign out</button></header><main><section id="login" class="card" style="max-width:400px;margin:50px auto"><h1 class="title">Welcome to Gatehouse</h1><p class="muted">Sign in to the demo workspace.</p><div class="tabs"><button class="active" data-mode="security">Security</button><button data-mode="resident">Resident</button></div><form id="loginForm"><div class="field"><label id="idLabel">Guard ID</label><input id="username" autocomplete="username" required value="guard01"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required value="demo123"></div><p class="message" id="loginError"></p><p class="toast" id="demoCreds">Demo only: guard01 / demo123</p><button class="btn" type="submit">Sign in →</button></form></section><section id="workspace" hidden><div class="row" style="margin-bottom:20px"><div><h1 class="title" id="greeting">Security desk</h1><div class="muted" id="description">Create an approval request for a resident.</div></div><span class="toast">Interactive demo · fictitious data only</span></div><div class="grid"><section id="newRequest" class="card"><h2 style="font:700 16px Manrope;margin:0">New access request</h2><form id="requestForm"><div class="field"><label>Request type</label><select id="kind"><option>Delivery / visitor</option><option>Taking item out</option></select></div><div class="field"><label>Resident / unit</label><select id="unit"><option value="A-204">Block A · Unit 204 — Ananya Shah</option><option value="B-101">Block B · Unit 101 — Priya Nair</option><option value="C-302">Block C · Unit 302 — Neha Kapoor</option></select></div><div class="field"><label>Person / company</label><input id="person" required placeholder="e.g. Demo Courier"></div><div class="field"><label>Details</label><textarea id="details" required placeholder="e.g. Sample parcel"></textarea></div><p class="message" id="formError"></p><button class="btn">Send approval request</button></form></section><section class="card"><div class="row"><h2 style="font:700 16px Manrope;margin:0">Requests</h2><button class="btn alt" id="refresh">Refresh</button></div><div id="requests" class="muted" style="margin-top:8px">Loading…</div></section></div></section></main><script src="./config.js"></script><script>
// Configure the API origin before Cloudflare deployment (for example, https://gatehouse-api.onrender.com).
const API_BASE=window.GATEHOUSE_API_BASE||'http://localhost:8080';let mode='security',auth='';const $=s=>document.querySelector(s);const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const unitNames={'A-204':'Ananya Shah','B-101':'Priya Nair','C-302':'Neha Kapoor'};function creds(){return 'Basic '+auth}async function api(path,opts={}){let response=await fetch(API_BASE+path,{...opts,headers:{'Content-Type':'application/json','Authorization':creds(),...(opts.headers||{})}});if(!response.ok){let msg=await response.text();throw Error(msg||`Request failed (${response.status})`)}return response.status===204?null:response.json()}function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));let r=m==='resident';$('#idLabel').textContent=r?'Resident email':'Guard ID';$('#username').value=r?'ananya@example.com':'guard01';$('#demoCreds').textContent=r?'Demo only: ananya@example.com / demo123':'Demo only: guard01 / demo123';$('#loginError').textContent=''}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('#loginForm').onsubmit=async e=>{e.preventDefault();auth=btoa($('#username').value.trim()+':'+$('#password').value);try{let profile=await api('/api/auth/me');if((mode==='resident')!==(profile.role==='RESIDENT'))throw Error('Choose the matching account type above.');$('#login').hidden=true;$('#workspace').hidden=false;$('#logout').hidden=false;$('#newRequest').hidden=mode==='resident';$('#greeting').textContent=mode==='resident'?'Resident inbox':'Security desk';$('#description').textContent=mode==='resident'?'Review requests sent to your home.':'Create an approval request for a resident.';await loadRequests()}catch(err){$('#loginError').textContent='Sign-in failed. Use the demo credentials shown.';auth=''}};$('#logout').onclick=()=>{auth='';$('#workspace').hidden=true;$('#login').hidden=false;$('#logout').hidden=true;$('#password').value='demo123'};$('#requestForm').onsubmit=async e=>{e.preventDefault();$('#formError').textContent='';try{await api('/api/requests',{method:'POST',body:JSON.stringify({unit:$('#unit').value,kind:$('#kind').value,person:$('#person').value.trim(),details:$('#details').value.trim()})});e.target.reset();await loadRequests()}catch(err){$('#formError').textContent='Could not save request. Check that the API is running.'}};$('#refresh').onclick=loadRequests;async function decide(id,status){try{await api(`/api/requests/${id}/decision`,{method:'PATCH',body:JSON.stringify({status})});await loadRequests()}catch(e){alert('Could not update this request.')}}async function loadRequests(){try{let items=await api('/api/requests'),box=$('#requests');box.innerHTML=items.length?items.map(r=>`<article class="request"><div class="row"><h3>${safe(r.kind)} · ${safe(r.person)}</h3><span class="badge ${r.status.toLowerCase()}">${safe(r.status)}</span></div><p><b>${safe(r.unit)} · ${safe(r.residentName||unitNames[r.unit]||'Resident')}</b><br>${safe(r.details)} · ${new Date(r.createdAt).toLocaleString()}</p>${r.status==='PENDING'?`<div class="actions"><button class="btn alt" onclick="decide(${r.id},'APPROVED')">Approve</button><button class="btn deny" onclick="decide(${r.id},'DENIED')">Deny</button></div>`:''}</article>`).join(''):'No requests yet.'}catch(e){$('#requests').textContent='API unavailable. Start the Spring Boot service and refresh.'}}setMode('security');
</script></body></html>
